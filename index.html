<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantasy Pixel RPG</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <h1>⚔️ Fantasy Pixel RPG</h1>
        <p>O novo núcleo modular do nosso RPG.</p>
      </div>
      <span class="badge">CORE v1.0</span>
    </header>

    <section class="game-panel">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="controls">WASD / setas: mover · Espaço / clique: atacar · I: inventário · E: poção · F5: salvar · F9: carregar · R: reiniciar</div>
    </section>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
